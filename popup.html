<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="task-section">
      <label for="task-text">What are you working on?</label>
      <input type="text" id="task-text" placeholder="e.g. chemistry homework" />
    </div>
    <div id="timer-section">
      <div id="timer-display">25:00</div>
      <div class="duration-picker">
        <label>
          <input id="duration-hours" type="number" min="0" max="23" value="0" />
          hr
        </label>
        <label>
          <input id="duration-minutes" type="number" min="0" max="59" value="25" />
          min
        </label>
        <label>
          <input id="duration-seconds" type="number" min="0" max="59" value="0" />
          sec
        </label>
      </div>
      <div class="timer-controls">
        <button id="start-task-btn" type="button">Start Focus</button>
        <button id="pause-timer-btn" type="button" disabled>Pause</button>
        <button id="cancel-timer-btn" type="button" disabled>Cancel</button>
      </div>
    </div>
    <div id="character-section">
      <img id="character-img" class="on-task" src="sleepbunny.png" alt="on-task" />
      <div id="summary-section" hidden>
        <p id="summary-text"></p>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
