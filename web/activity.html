<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity · Focus Buddy</title>
    <link rel="icon" href="../logo.PNG" type="image/png" />
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body class="activity-page">
    <div class="activity-scene" aria-hidden="true">
      <img class="activity-scene-layer" src="/couchareasprites/bg.png" alt="" />
      <img class="activity-scene-layer" src="/couchareasprites/couch2.png" alt="" />
      <img class="activity-scene-layer" src="/couchareasprites/couch1.png" alt="" />
    </div>
    <div class="top-bar" aria-hidden="true"></div>
    <header class="subpage-bar activity-header">
      <a class="subpage-home" href="index.html"><img class="app-mark" src="../logo.PNG" alt="" />Focus Buddy</a>
      <nav class="page-nav" data-site-nav></nav>
    </header>
    <p id="activity-banner" class="sites-status activity-banner" aria-live="polite"></p>
    <div id="activity-lounge" class="activity-lounge" aria-label="Friends in the lounge"></div>

    <aside id="activity-panel" class="activity-panel" hidden>
      <button id="activity-panel-close" class="activity-panel-close" type="button">Close</button>
      <div id="activity-panel-body" class="activity-panel-body"></div>
    </aside>

    <script type="module" src="activity.js"></script>
  </body>
</html>
