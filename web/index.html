<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Buddy</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"></div>

    <main class="page">
      <header class="hero">
        <div class="brand">
          <h1 class="logo">
            <span class="logo-line">
              <span class="logo-focus">Focus</span>
              <svg class="logo-star" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z"
                />
              </svg>
            </span>
            <span class="logo-buddy-row">
              <span class="logo-buddy">Buddy</span>
              <span class="preview" aria-live="polite">
                <img id="character-preview" src="../assets/sleepbunny.png" alt="Sleep bunny" />
              </span>
            </span>
          </h1>
          <p class="tagline">A fun way to stay on task!</p>
        </div>
      </header>

      <section class="picker" aria-label="Choose a buddy">
        <p class="picker-copy">Click on a buddy to help keep you on track.</p>
        <div class="picker-options" role="listbox" aria-label="Available buddies">
          <button
            type="button"
            class="buddy-option"
            role="option"
            data-character="cat"
            aria-selected="false"
            aria-label="Choose cat buddy"
          >
            <img src="../assets/cat.png" alt="" />
          </button>
          <button
            type="button"
            class="buddy-option is-selected"
            role="option"
            data-character="sleepbunny"
            aria-selected="true"
            aria-label="Choose sleep bunny buddy"
          >
            <img src="../assets/sleepbunny.png" alt="" />
          </button>
        </div>
      </section>

      <section class="dashboard" aria-label="Focus dashboard">
        <div class="dash-rule" aria-hidden="true"></div>
        <h2 class="dash-title">Your focus session</h2>

        <div class="dash-grid">
          <div class="dash-panel dash-task">
            <label class="field-label" for="task-input">What are you working on?</label>
            <input
              id="task-input"
              class="field-input"
              type="text"
              placeholder="Write an essay, study chemistry…"
              autocomplete="off"
            />
          </div>

          <div class="dash-panel dash-sites">
            <label class="field-label" for="site-input">Allowed websites</label>
            <div class="site-row">
              <input
                id="site-input"
                class="field-input"
                type="url"
                placeholder="https://docs.google.com"
                autocomplete="off"
              />
              <button id="add-site-btn" class="btn btn-secondary" type="button">Add</button>
            </div>
            <ul id="site-list" class="site-list" aria-live="polite"></ul>
          </div>

          <div class="dash-panel dash-timer">
            <p class="field-label">Session length</p>
            <div class="duration-row">
              <label class="duration-field">
                <span>Hours</span>
                <input id="hours-input" class="field-input duration-input" type="number" min="0" max="12" value="0" />
              </label>
              <label class="duration-field">
                <span>Minutes</span>
                <input id="minutes-input" class="field-input duration-input" type="number" min="0" max="59" value="25" />
              </label>
            </div>

            <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>

            <div class="timer-controls">
              <button id="start-timer-btn" class="btn btn-primary" type="button">Start</button>
              <button id="pause-timer-btn" class="btn btn-secondary" type="button" disabled>Pause</button>
              <button id="end-timer-btn" class="btn btn-end" type="button" disabled>End</button>
            </div>

            <p id="timer-status" class="timer-status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>

    <script src="buddy.js"></script>
  </body>
</html>
