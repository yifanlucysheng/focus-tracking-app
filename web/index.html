<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Buddy</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"></div>

    <main class="page">
      <div class="intro-section">
        <header class="home-nav">
          <nav class="page-nav" data-site-nav></nav>
        </header>

        <header class="hero">
          <div class="brand">
            <h1 class="logo">
              <span class="logo-line">
                <span class="logo-focus">Focus</span>
                <svg class="logo-star" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z"
                  />
                </svg>
              </span>
              <span class="logo-buddy-row">
                <span class="logo-buddy">Buddy</span>
                <span class="preview" aria-live="polite">
                  <img id="character-preview" src="../assets/sleepbunny.png" alt="Sleep bunny" />
                </span>
              </span>
            </h1>
            <p class="tagline">A fun way to stay on task!</p>
          </div>
        </header>

        <section class="picker" aria-label="Choose a buddy">
          <p class="picker-copy">Click on a buddy to help keep you on track.</p>
          <div class="picker-options" role="listbox" aria-label="Available buddies">
            <button
              type="button"
              class="buddy-option"
              role="option"
              data-character="cat"
              aria-selected="false"
              aria-label="Choose Cat Buddy"
            >
              <img src="../assets/cat.png" alt="" />
              <span class="buddy-option-name">Cat Buddy</span>
            </button>
            <button
              type="button"
              class="buddy-option is-selected"
              role="option"
              data-character="sleepbunny"
              aria-selected="true"
              aria-label="Choose Moon Buddy"
            >
              <img src="../assets/sleepbunny.png" alt="" />
              <span class="buddy-option-name">Moon Buddy</span>
            </button>
          </div>
          <div class="buddy-bio" aria-live="polite">
            <p id="buddy-bio-name" class="buddy-bio-name">Moon Buddy</p>
            <p id="buddy-bio-blurb" class="buddy-bio-blurb"></p>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="buddy.js"></script>
  </body>
</html>
