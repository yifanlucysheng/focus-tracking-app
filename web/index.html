<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Buddy</title>
    <link rel="icon" href="/logo.PNG" type="image/png" />
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"></div>

    <main class="page">
      <div class="intro-section">
        <header class="home-nav">
          <nav class="page-nav" data-site-nav></nav>
        </header>

        <header class="hero">
          <div class="brand">
            <h1 class="logo">
              <span class="logo-line">
                <span class="logo-focus">Focus</span>
                <img class="logo-star" src="/logo.PNG" alt="" />
              </span>
              <span class="logo-buddy-row">
                <span class="logo-buddy">Buddy</span>
                <span class="preview" aria-live="polite">
                  <img id="character-preview" src="/sleepbunny.png" alt="Sleep bunny" />
                </span>
              </span>
            </h1>
            <p class="tagline">A fun way to stay on task!</p>
          </div>
        </header>

        <section class="picker" aria-label="Choose a buddy">
          <p class="picker-copy">Click on a buddy to help keep you on track.</p>
          <div class="picker-options" role="listbox" aria-label="Available buddies">
            <button
              type="button"
              class="buddy-option"
              role="option"
              data-character="cat"
              aria-selected="false"
              aria-label="Choose cat buddy"
            >
              <img src="/cat.png" alt="" />
            </button>
            <button
              type="button"
              class="buddy-option is-selected"
              role="option"
              data-character="sleepbunny"
              aria-selected="true"
              aria-label="Choose sleep bunny buddy"
            >
              <img src="/sleepbunny.png" alt="" />
            </button>
          </div>
        </section>
      </div>
    </main>

    <div class="bottom-bar" aria-hidden="true"></div>

    <script type="module" src="buddy.js"></script>
  </body>
</html>
