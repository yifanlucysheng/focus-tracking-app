<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Buddy</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"></div>

    <main class="page">
      <div class="intro-section">
        <header class="hero">
          <div class="brand">
            <h1 class="logo">
              <span class="logo-line">
                <span class="logo-focus">Focus</span>
                <svg class="logo-star" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z"
                  />
                </svg>
              </span>
              <span class="logo-buddy-row">
                <span class="logo-buddy">Buddy</span>
                <span class="preview" aria-live="polite">
                  <img id="character-preview" src="../assets/sleepbunny.png" alt="Sleep bunny" />
                </span>
              </span>
            </h1>
            <p class="tagline">A fun way to stay on task!</p>
          </div>
        </header>

        <section class="picker" aria-label="Choose a buddy">
          <p class="picker-copy">Click on a buddy to help keep you on track.</p>
          <div class="picker-options" role="listbox" aria-label="Available buddies">
            <button
              type="button"
              class="buddy-option"
              role="option"
              data-character="cat"
              aria-selected="false"
              aria-label="Choose cat buddy"
            >
              <img src="../assets/cat.png" alt="" />
            </button>
            <button
              type="button"
              class="buddy-option is-selected"
              role="option"
              data-character="sleepbunny"
              aria-selected="true"
              aria-label="Choose sleep bunny buddy"
            >
              <img src="../assets/sleepbunny.png" alt="" />
            </button>
          </div>
        </section>

        <nav class="page-nav" aria-label="Page sections">
          <a class="page-nav-link" href="#focus-session">Focus session</a>
          <a class="page-nav-link" href="#your-stats">Your stats</a>
          <a class="page-nav-link" href="#friends">Friends</a>
        </nav>
      </div>

      <section id="focus-session" class="dashboard" aria-label="Focus dashboard">
        <div class="section-divider" aria-hidden="true">
          <span class="section-divider-ornament" data-side="left">
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
          <span class="section-divider-label">Your focus session</span>
          <span class="section-divider-ornament" data-side="right">
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
        </div>

        <div class="dash-grid">
          <div class="dash-panel dash-task">
            <label class="field-label" for="task-input">What are you working on?</label>
            <input
              id="task-input"
              class="field-input"
              type="text"
              placeholder="Write an essay, study chemistry…"
              autocomplete="off"
            />
          </div>

          <div class="dash-panel dash-sites">
            <label class="field-label" for="block-site-input">Specific sites you want to block?</label>
            <div class="site-row">
              <input
                id="block-site-input"
                class="field-input"
                type="url"
                placeholder="https://youtube.com"
                autocomplete="off"
              />
              <button id="add-block-site-btn" class="btn btn-secondary btn-small" type="button">Add</button>
            </div>
            <ul id="block-site-list" class="site-list" aria-live="polite"></ul>
          </div>

          <div class="dash-panel dash-allow">
            <label class="field-label" for="allow-site-input">Always Allow</label>
            <div class="site-row">
              <input
                id="allow-site-input"
                class="field-input"
                type="url"
                placeholder="https://docs.google.com"
                autocomplete="off"
              />
              <button id="add-allow-site-btn" class="btn btn-secondary btn-small" type="button">Add</button>
            </div>
            <ul id="allow-site-list" class="site-list" aria-live="polite"></ul>
          </div>

          <p id="sites-status" class="sites-status" aria-live="polite"></p>
        </div>
      </section>

      <section id="your-stats" class="profile-section" aria-label="Personal stats">
        <div class="section-divider" aria-hidden="true">
          <span class="section-divider-ornament" data-side="left">
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
          <span class="section-divider-label">Your stats</span>
          <span class="section-divider-ornament" data-side="right">
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
        </div>

        <div id="profile-stats-root" class="profile-stats-root"></div>
      </section>

      <section id="friends" class="friends-section" aria-label="Friends and leaderboard">
        <div class="section-divider" aria-hidden="true">
          <span class="section-divider-ornament" data-side="left">
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
          <span class="section-divider-label">Friends</span>
          <span class="section-divider-ornament" data-side="right">
            <svg class="ornament-star ornament-star-sm" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
            <svg class="ornament-moon" viewBox="0 0 24 24">
              <path d="M16.5 3.2a9.2 9.2 0 1 0 4.3 16.1 8 8 0 1 1-4.3-16.1z" />
            </svg>
            <svg class="ornament-star" viewBox="0 0 24 24">
              <path d="M12 2.5l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8l-6 3.9 1.6-6.7-5.2-4.6 6.9-.6L12 2.5z" />
            </svg>
          </span>
        </div>

        <div id="friends-root" class="friends-root"></div>
      </section>
    </main>

    <script type="module" src="buddy.js"></script>
  </body>
</html>
