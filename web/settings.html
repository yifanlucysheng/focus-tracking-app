<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings · Focus Buddy</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div class="top-bar" aria-hidden="true"></div>
    <main class="page page-inner">
      <header class="subpage-bar">
        <a class="subpage-home" href="index.html">Focus Buddy</a>
        <nav class="page-nav" data-site-nav></nav>
      </header>
      <section class="settings-section" aria-label="Account settings">
        <div data-section-divider></div>
        <p id="settings-banner" class="sites-status" aria-live="polite"></p>

        <div id="signed-out-panel" class="dash-panel">
          <p class="field-label">Create an account</p>
          <input id="signup-username" class="field-input" type="text" placeholder="Username" autocomplete="username" />
          <input id="signup-email" class="field-input" type="email" placeholder="Email" autocomplete="email" />
          <input id="signup-password" class="field-input" type="password" placeholder="Password" autocomplete="new-password" />
          <button id="signup-btn" class="btn btn-secondary" type="button">Create account</button>
          <p class="field-label">Already have an account?</p>
          <input id="signin-email" class="field-input" type="email" placeholder="Email" autocomplete="email" />
          <input id="signin-password" class="field-input" type="password" placeholder="Password" autocomplete="current-password" />
          <button id="signin-btn" class="btn btn-secondary" type="button">Sign in</button>
        </div>

        <div id="signed-in-panel" class="settings-grid" hidden>
          <div class="dash-panel">
            <p class="field-label">Signed in as</p>
            <p id="settings-username" class="settings-username"></p>
            <button id="signout-btn" class="btn btn-secondary btn-small" type="button">Sign out</button>
          </div>
          <div class="dash-panel">
            <label class="field-label" for="status-input">Custom status</label>
            <input id="status-input" class="field-input" type="text" maxlength="40" placeholder="grinding, on a break…" />
            <button id="save-status-btn" class="btn btn-secondary btn-small" type="button">Save status</button>
          </div>
          <div class="dash-panel">
            <p class="field-label">Privacy</p>
            <label class="toggle-row">
              <input id="share-stats-toggle" type="checkbox" />
              Allow friends to see my stats
            </label>
            <label class="toggle-row">
              <input id="share-listening-toggle" type="checkbox" />
              Share what I’m listening to
            </label>
            <p class="folders-hint">These are stored on your account. Friends cannot read hidden data even if the UI tried to show it.</p>
          </div>
          <div class="dash-panel">
            <p class="field-label">Spotify</p>
            <p id="spotify-status" class="folders-hint">Not connected</p>
            <button id="spotify-connect-btn" class="btn btn-secondary" type="button">Connect Spotify</button>
            <button id="spotify-disconnect-btn" class="btn btn-secondary btn-small" type="button">Disconnect</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
